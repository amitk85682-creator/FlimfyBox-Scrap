# ======================================================================
# 🚀 Universal Scraper Cluster — GitHub Actions Workflow
# ======================================================================
# Single workflow that replaces ALL per-site workflows.
#
# Triggers:
#   • Cron   : Daily midnight UTC → Watchdog mode for all sites
#   • Manual : Choose mode (matrix/watchdog/discovery/worker), site, bot count
#
# Architecture:
#   1. "setup" job computes the dynamic matrix from inputs
#   2. "scrape" job fans out across site × bot_id combinations
#
# Phase B modes:
#   • discovery : Seed crawl_jobs queue (no extraction)
#   • worker    : Drain crawl_jobs queue (full extraction pipeline)
# ======================================================================

name: "🚀 Universal Scraper Cluster"

on:
  # ── Scheduled: Phase B Continuous Operation ──────────────────────────────────
  schedule:
    - cron: "30 0,12 * * *"                  # Discovery: runs twice daily to populate queue
    - cron: "0 0,3,6,9,12,15,18,21 * * *"    # Workers: drain queue continuously (every 3 hours)

  # ── Manual trigger with full control ───────────────────────────────
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "watchdog"
        type: choice
        options:
          - watchdog
          - matrix
          - discovery
          - worker
      site:
        description: "Target site (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - filmyzilla
          - hdhub4u
          - mkvcinemas
      total_bots:
        description: "Parallel bots per site (matrix/discovery mode only)"
        required: false
        default: "5"
        type: string
      force_refresh:
        description: "Force re-scrape all URLs even if already in scraped_urls"
        required: false
        default: "false"
        type: boolean
      discovery_watchdog:
        description: "Discovery watchdog mode (top-N only, for 'discovery' mode)"
        required: false
        default: "false"
        type: boolean
      max_worker_jobs:
        description: "Max jobs per worker run (0=unlimited, for 'worker' mode GHA)"
        required: false
        default: "500"
        type: string

jobs:
  # ================================================================
  # SETUP: Compute dynamic matrix from inputs / schedule
  # ================================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      site_matrix:       ${{ steps.compute.outputs.site_matrix }}
      bot_matrix:        ${{ steps.compute.outputs.bot_matrix }}
      mode:              ${{ steps.compute.outputs.mode }}
      total_bots:        ${{ steps.compute.outputs.total_bots }}
      force_refresh:     ${{ steps.compute.outputs.force_refresh }}
      discovery_watchdog: ${{ steps.compute.outputs.discovery_watchdog }}
      max_worker_jobs:   ${{ steps.compute.outputs.max_worker_jobs }}

    steps:
      - name: Compute matrix dimensions
        id: compute
        run: |
          # ── Determine mode and scheduled flags ────────────────────────
          if [ "${{ github.event_name }}" == "schedule" ]; then
            if [ "${{ github.event.schedule }}" == "30 0,12 * * *" ]; then
              MODE="discovery"
              FORCE="false"
              DISC_WD="true"
            else
              MODE="worker"
              FORCE="false"
              DISC_WD="false"
            fi
          else
            MODE="${{ github.event.inputs.mode }}"
            FORCE="${{ github.event.inputs.force_refresh || 'false' }}"
            DISC_WD="${{ github.event.inputs.discovery_watchdog || 'false' }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          # ── Output flags ──────────────────────────────────────────────
          echo "force_refresh=$FORCE" >> "$GITHUB_OUTPUT"
          echo "discovery_watchdog=$DISC_WD" >> "$GITHUB_OUTPUT"

          # ── Max worker jobs ───────────────────────────────────────────
          MAX_WJ="${{ github.event.inputs.max_worker_jobs || '500' }}"
          echo "max_worker_jobs=$MAX_WJ" >> "$GITHUB_OUTPUT"

          # ── Determine site list ────────────────────────────────────
          SITE="${{ github.event.inputs.site || 'all' }}"
          if [ "$SITE" == "all" ]; then
            if [ "$MODE" == "worker" ]; then
              # Start with 2 workers conservatively for continuous operation
              echo 'site_matrix=["filmyzilla","hdhub4u","mkvcinemas"]' >> "$GITHUB_OUTPUT"
            else
              echo 'site_matrix=["filmyzilla","hdhub4u","mkvcinemas"]' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "site_matrix=[\"$SITE\"]" >> "$GITHUB_OUTPUT"
          fi

          # ── Determine bot IDs ──────────────────────────────────────
          TOTAL="${{ github.event.inputs.total_bots || '5' }}"
          echo "total_bots=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$MODE" == "watchdog" ] || [ "$MODE" == "worker" ] || [ "$DISC_WD" == "true" ]; then
            # Watchdog and worker only need 1 bot per site
            echo 'bot_matrix=[1]' >> "$GITHUB_OUTPUT"
          else
            # Matrix / discovery mode: generate [1, 2, ..., N]
            BOT_LIST=$(python3 -c "import json; print(json.dumps(list(range(1, int('$TOTAL')+1))))")
            echo "bot_matrix=$BOT_LIST" >> "$GITHUB_OUTPUT"
          fi

  # ================================================================
  # SCRAPE: Fan out across site × bot_id
  # ================================================================
  scrape:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360     # 6-hour GitHub Actions limit

    strategy:
      fail-fast: false       # One site/bot failure must NOT kill others
      matrix:
        site:   ${{ fromJSON(needs.setup.outputs.site_matrix) }}
        bot_id: ${{ fromJSON(needs.setup.outputs.bot_matrix) }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      # ── Python ───────────────────────────────────────────────────
      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Dependencies ─────────────────────────────────────────────
      - name: "📦 Install Dependencies"
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      # ── Run ──────────────────────────────────────────────────────
      - name: "🚀 Run ${{ needs.setup.outputs.mode }} — ${{ matrix.site }} (Bot ${{ matrix.bot_id }})"
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY:         ${{ secrets.TMDB_API_KEY }}
          FORCE_REFRESH:        ${{ needs.setup.outputs.force_refresh }}
          DB_POOL_SIZE:         "3"  # TEMP DIAGNOSTIC: forces MAX_ACTIVE=1 — revert after test
          DISCOVERY_WATCHDOG:   ${{ needs.setup.outputs.discovery_watchdog }}
          MAX_WORKER_JOBS:      ${{ needs.setup.outputs.max_worker_jobs }}
          PYTHONUNBUFFERED:     "1"
        run: |
          python main.py \
            --site ${{ matrix.site }} \
            --mode ${{ needs.setup.outputs.mode }} \
            --bot_id ${{ matrix.bot_id }} \
            --total_bots ${{ needs.setup.outputs.total_bots }}

