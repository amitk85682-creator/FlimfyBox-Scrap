name: 15-Bot Matrix Scraper

on:
  workflow_dispatch:

jobs:
  scrape-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bot: 1, start: 1, end: 68 }
          - { bot: 2, start: 69, end: 136 }
          - { bot: 3, start: 137, end: 204 }
          - { bot: 4, start: 205, end: 272 }
          - { bot: 5, start: 273, end: 340 }
          - { bot: 6, start: 341, end: 408 }
          - { bot: 7, start: 409, end: 476 }
          - { bot: 8, start: 477, end: 544 }
          - { bot: 9, start: 545, end: 612 }
          - { bot: 10, start: 613, end: 680 }
          - { bot: 11, start: 681, end: 748 }
          - { bot: 12, start: 749, end: 816 }
          - { bot: 13, start: 817, end: 884 }
          - { bot: 14, start: 885, end: 952 }
          - { bot: 15, start: 953, end: 1016 }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Scraper Bot ${{ matrix.bot }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scraper.py --start_page ${{ matrix.start }} --end_page ${{ matrix.end }}
