name: 24/7 Movie Bot Scraper

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: 'Start page number'
        required: false
        default: '1'
      end_page:
        description: 'End page number'
        required: false
        default: '68'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Scraper Bot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scraper.py --start_page ${{ github.event.inputs.start_page }} --end_page ${{ github.event.inputs.end_page }}
